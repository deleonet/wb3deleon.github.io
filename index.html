<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edgar De Leon | Security Infrastructure</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/variables.css">
    <style>
        .status-header { background: var(--bg-secondary); padding: 12px 20px; display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 11px; border-bottom: 1px solid var(--border-color); }
        .pulse { width: 8px; height: 8px; background: var(--accent-security); border-radius: 50%; display: inline-block; margin-right: 5px; box-shadow: 0 0 10px var(--accent-security); animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
        .hero { padding: 60px 20px; text-align: center; }
        .hero h1 { font-size: 2.5rem; font-weight: 800; margin: 0; letter-spacing: -2px; }
        .hero p { color: var(--accent-primary); font-family: var(--font-mono); text-transform: uppercase; font-size: 0.8rem; letter-spacing: 2px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; padding: 20px; margin-bottom: 80px; }
        .card { background: var(--bg-secondary); border: 1px solid var(--border-color); padding: 25px; border-radius: 16px; transition: var(--transition); text-decoration: none; color: inherit; }
        .card:hover { border-color: var(--accent-primary); transform: translateY(-5px); }
        .card i { font-size: 2rem; color: var(--accent-primary); margin-bottom: 15px; }
        .nav-bar { position: fixed; bottom: 0; width: 100%; background: rgba(17, 24, 39, 0.95); backdrop-filter: blur(10px); display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid var(--border-color); }
        .nav-item { color: var(--text-muted); text-decoration: none; font-size: 10px; display: flex; flex-direction: column; align-items: center; }
        .nav-item.active { color: var(--accent-primary); }
    </style>
</head>
<body>
    <div class="status-header">
        <div><span class="pulse"></span> SYSTEM: ONLINE</div>
        <div id="clock">00:00:00</div>
    </div>
    <section class="hero">
        <h1 class="typewriter">Edgar De Leon</h1>
        <p>Especialista en Infraestructura Crítica</p>
    </section>
    <div class="grid">
        <a href="projects.html" class="card">
            <i class="fas fa-network-wired"></i>
            <h3>Operaciones</h3>
            <p style="color: var(--text-muted)">Arquitectura de red y resiliencia de sistemas.</p>
        </a>
        <a href="certs.html" class="card">
            <i class="fas fa-user-shield"></i>
            <h3>Credenciales</h3>
            <p style="color: var(--text-muted)">Validación técnica de competencias internacionales.</p>
        </a>
    </div>
    <nav class="nav-bar">
        <a href="index.html" class="nav-item active"><i class="fas fa-th-large"></i><span>HOME</span></a>
        <a href="projects.html" class="nav-item"><i class="fas fa-layer-group"></i><span>PROYECTOS</span></a>
        <a href="certs.html" class="nav-item"><i class="fas fa-certificate"></i><span>CERTS</span></a>
        <a href="contact.html" class="nav-item"><i class="fas fa-terminal"></i><span>CONTACTO</span></a>
    </nav>
    <script src="js/main.js"></script>
</body>
</html>
